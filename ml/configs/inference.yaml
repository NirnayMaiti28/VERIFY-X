# VERIFY-X 2.0 — Inference Configuration
# ──────────────────────────────────────────

text_model:
  base_model: "Qwen/Qwen3-8B"
  adapter: ""  # Path or HF Hub ID for LoRA adapter
  quantization:
    bits: 4
    quant_type: "nf4"
    compute_dtype: "bfloat16"
  generation:
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.9
    do_sample: false
    repetition_penalty: 1.1

vision_model:
  base_model: "Qwen/Qwen2.5-VL-7B-Instruct"
  adapter: ""
  quantization:
    bits: 4
    quant_type: "nf4"
    compute_dtype: "bfloat16"
  generation:
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.9

embedding_model:
  name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 64
  max_seq_length: 256
  normalize: true

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  batch_size: 16
  max_length: 512

retrieval:
  max_candidates: 20
  top_k_evidence: 5
  bm25_weight: 0.3
  dense_weight: 0.7
